name: Deploy to GitHub Pages

# Veröffentlicht den Stand von main auf dem gh-pages-Branch.
# GitHub Pages ist auf "Deploy from a branch: gh-pages" eingestellt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          # portal/ ist Servercode und gehoert nicht auf eine statische Seite.
          # Es steht kein Passwort darin, alles kommt aus der Umgebung, aber
          # ausgeliefert werden soll er trotzdem nicht.
          exclude_assets: '.github,tools,docs,portal,.gitignore,PLATZHALTER.md,README.md'
          cname: valtixfm.de
